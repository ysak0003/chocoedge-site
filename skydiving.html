<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スカイダイビング | Cozy Bottle Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfcfc;
            --accent-color: #8ed1ca;
            --text-main: #554a41;
            --card-bg: #ffffff;
            --border-radius: 20px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
            line-height: 1.8;
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* YouTubeのレスポンシブ埋め込み設定 */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 の比率 */
            height: 0;
            overflow: hidden;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        h1 { font-size: 1.8em; margin-bottom: 10px; }
        .description { font-size: 1.1em; color: #666; margin-bottom: 40px; }

        .store-section {
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            text-align: center;
            border: 2px solid #eee;
        }

        .store-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .store-button img { height: 45px; width: auto; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 50px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>脱出ゲーム スカイダイビング<br>高度4000mからの帰り道</h1>
        <p class="description">おうちに帰るまでがスカイダイビングです。
安全第一。高高度からのゆるゆる脱出。機内の謎を解いてドアを開け、
お昼寝大好きなスカイダイバー達とレッツジャンプ！
</p>

        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/I4Rl_iwl5gU" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <div class="store-section">
            <p>アプリのダウンロードはこちらから</p>
            <div class="store-links">
                <a href="https://play.google.com/store/apps/details?id=com.chocoedge.skydiving" class="store-button">
                    <img src="GooglePlayEn.png" alt="Google Play">
                </a>
                 <a href="https://apps.apple.com/jp/app/id6779870345" class="store-button">
                    <img src="AppStore.svg" alt="App Store">
                </a>
            </div>
        </div>

        <a href="index.html" class="back-link">← トップページへ戻る</a>
    </div>

</body>
</html>
