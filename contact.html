<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Cozy Bottle Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfcfc;
            --accent-color: #8ed1ca;
            --text-main: #554a41;
            --card-bg: #ffffff;
            --border-radius: 20px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
            line-height: 1.8;
            margin: 0;
        }

        .page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 60px); /* メニューの下で画面中央に配置 */
            padding: 40px 0;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        .contact-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 50px 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            border: 2px solid #eee;
        }

        h1 {
            font-size: 1.6em;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .contact-info {
            margin: 30px 0;
        }

        /* メールアドレス画像の設定 */
        .email-image {
            max-width: 30%;
            height: auto;
            /* 画像を少し浮かせて「ほっこり感」を出す
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.05)); */
        }

        .note {
            font-size: 0.85em;
            color: #888;
            margin-top: 20px;
        }

        .back-link {
            display: inline-block;
            margin-top: 40px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* ===== 共通メニュー（全ページ同じ内容） ===== */
        .site-nav {
            background: #ffffff;
            border-bottom: 1px solid #eee;
        }
        .site-nav-inner {
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #554a41;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 16px;
            white-space: nowrap;
        }
        .nav-brand img { height: 32px; width: auto; }
        .nav-links {
            display: flex;
            gap: 22px;
            list-style: none;
            margin: 0 0 0 auto;
            padding: 0;
        }
        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.95em;
            padding: 4px 2px;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s ease;
        }
        .nav-links a:hover,
        .nav-links a.current { border-bottom-color: var(--accent-color); }
        @media (max-width: 520px) {
            .nav-brand span { display: none; }
            .nav-links { gap: 16px; }
            .nav-links a { font-size: 0.9em; }
        }
    </style>
</head>
<body>
<nav class="site-nav">
    <div class="site-nav-inner">
        <a href="index.html" class="nav-brand"><img src="logo_icon.png" alt=""><span>Cozy Bottle Studio</span></a>
        <ul class="nav-links">
            <li><a href="index.html">ゲーム</a></li>
            <li><a href="apps.html">アプリ</a></li>
            <li><a href="contact.html" class="current">お問い合わせ</a></li>
        </ul>
    </div>
</nav>

    <div class="page">
    <div class="container">
        <div class="contact-card">
            <h1>お問い合わせ</h1>
            <p>ゲーム・アプリに関するご意見・ご要望や、<br>お仕事のご依頼はこちらまでお願いいたします。</p>
            
            <div class="contact-info">
                <img src="contact_mail.png" alt="お問い合わせメールアドレス" class="email-image">
                <p class="note">※スパム対策のため画像にしております。<br>お手数ですが手入力にてお願いいたします。</p>
            </div>
        </div>

        <a href="index.html" class="back-link">← トップページへ戻る</a>
    </div>
    </div>

</body>
</html>
