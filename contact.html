<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Cozy Bottle Studio</title>
    <style>
        :root {
            --bg-color: #fcfcfc;
            --accent-color: #8ed1ca;
            --text-main: #554a41;
            --card-bg: #ffffff;
            --border-radius: 20px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
            line-height: 1.8;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* 画面中央に配置 */
        }

        .container {
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        .contact-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 50px 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            border: 2px solid #eee;
        }

        h1 {
            font-size: 1.6em;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .contact-info {
            margin: 30px 0;
        }

        /* メールアドレス画像の設定 */
        .email-image {
            max-width: 30%;
            height: auto;
            /* 画像を少し浮かせて「ほっこり感」を出す
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.05)); */
        }

        .note {
            font-size: 0.85em;
            color: #888;
            margin-top: 20px;
        }

        .back-link {
            display: inline-block;
            margin-top: 40px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="contact-card">
            <h1>お問い合わせ</h1>
            <p>ゲームに関するご意見・ご要望や、<br>お仕事のご依頼はこちらまでお願いいたします。</p>
            
            <div class="contact-info">
                <img src="contact_mail.png" alt="お問い合わせメールアドレス" class="email-image">
                <p class="note">※スパム対策のため画像にしております。<br>お手数ですが手入力にてお願いいたします。</p>
            </div>
        </div>

        <a href="index.html" class="back-link">← トップページへ戻る</a>
    </div>

</body>
</html>
